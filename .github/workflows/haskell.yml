name: Haskell CI

on:
  push:
  pull_request:

jobs:
  cabal-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Haskell
        uses: haskell/actions/setup@v2
        with:
          ghc-version: "9.6.6"
          cabal-version: "latest"
      - name: Cache cabal store
        uses: actions/cache@v3
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project*') }}
          restore-keys: |
            ${{ runner.os }}-cabal-
      - name: Build and test
        run: |
          cabal update
          cabal test
