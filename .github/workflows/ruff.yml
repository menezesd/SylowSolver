name: Ruff

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Lint with Ruff
        run: ruff check sylow_solver auto2.py sylow2.py
      - name: Check formatting with Ruff
        run: ruff format --check sylow_solver auto2.py sylow2.py
      - name: Byte-compile sources
        run: python -m compileall sylow_solver auto2.py sylow2.py
